<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d50" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12101c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="地球 Online 美食图鉴 —— 打卡收集你的美食图鉴" />
    <title>地球 Online 美食图鉴</title>
    <script>
      // 首帧前同步主题，避免暗色模式闪白（FOUC）
      try {
        var t = localStorage.getItem('fooddex.theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
