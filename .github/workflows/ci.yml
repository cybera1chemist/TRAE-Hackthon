# CI（T0-03 / TDD §9.1）：PR 与 zxc/main 推送触发
# 流水线：install(pnpm) → lint → typecheck → test → build → e2e → PR 预览部署
name: CI

on:
  pull_request:
  push:
    branches: [zxc, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 package.json#packageManager）
        uses: pnpm/action-setup@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Component Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E（Playwright 双视口）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行 E2E
        run: pnpm e2e

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  preview:
    name: PR 预览部署
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'pull_request' && vars.DEPLOY_PREVIEW == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      # 需在仓库 Secrets 配置 VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID，
      # 并在仓库 Variables 打开 DEPLOY_PREVIEW=true 后本 Job 才会执行。
      - name: Vercel 预览部署
        run: |
          pnpm dlx vercel@latest deploy dist --prebuilt --token="$VERCEL_TOKEN" --cwd .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
